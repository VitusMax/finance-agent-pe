const ctx = document.createElement('canvas').getContext('2d');
const tw = (s, f) => { ctx.font = f; return ctx.measureText(s).width; };

const root = mk('g',{transform:'translate(40,56)'});
const gE = mk('g',{},root), gL = mk('g',{},root), gN = mk('g',{},root);

/* rounded orthogonal polyline; last point pulled back so the arrow touches the node ring */
function roundPath(pts, r, endGap){
  pts = pts.map(p => p.slice());
  const a = pts[pts.length-2], b = pts[pts.length-1];
  const dx = Math.sign(b[0]-a[0]), dy = Math.sign(b[1]-a[1]);
  b[0] -= dx*endGap; b[1] -= dy*endGap;
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i=1;i<pts.length-1;i++){
    const p0=pts[i-1], p1=pts[i], p2=pts[i+1];
    const l1=Math.hypot(p1[0]-p0[0],p1[1]-p0[1]), l2=Math.hypot(p2[0]-p1[0],p2[1]-p1[1]);
    const rr=Math.min(r,l1/2,l2/2);
    const q1=[p1[0]+(p0[0]-p1[0])*rr/l1, p1[1]+(p0[1]-p1[1])*rr/l1];
    const q2=[p1[0]+(p2[0]-p1[0])*rr/l2, p1[1]+(p2[1]-p1[1])*rr/l2];
    d += ` L${q1[0]},${q1[1]} Q${p1[0]},${p1[1]} ${q2[0]},${q2[1]}`;
  }
  return d + ` L${b[0]},${b[1]}`;
}

  mk('rect',{x:x0+4.5, y:y-3.5, width:7, height:7, rx:1.5, fill:'none', stroke:'#7A8293','stroke-width':.9}, g);

  mk('text',{x:x0+16, y:y+3.3, 'font-size':9.5, 'font-weight':500, fill:'#3B4252'}, g).textContent = text;
}

  /* label on longest segment */
  let best=0, bi=0;
  for (let i=0;i<pts.length-1;i++){ const l=Math.hypot(pts[i+1][0]-pts[i][0],pts[i+1][1]-pts[i][1]); if(l>best){best=l;bi=i;} }
  const [p,q] = [pts[bi], pts[bi+1]];
  const vertical = p[0]===q[0];
  if (lp) pill(lp[0], lp[1], fmt(n), al);
  else pill((p[0]+q[0])/2, (p[1]+q[1])/2, fmt(n), vertical ? al : 'c');
});

NODES.forEach(nd => {
  const g = mk('g',{}, gN);
  if (nd.start){
    const c = C[nd.start];
    mk('circle',{cx:nd.x, cy:nd.y, r:6.5, fill:'#fff', stroke:c, 'stroke-width':1.6}, g);
    mk('text',{x:nd.x+12, y:nd.y-2, 'font-size':10.5, 'font-weight':600, fill:'#1F2633'}, g).textContent = nd.name;
    const sx = nd.x+12, sy = nd.y+11;
    mk('rect',{x:sx, y:sy-6.5, width:7, height:7, rx:1.5, fill:'none', stroke:'#7A8293','stroke-width':.9}, g);
    mk('text',{x:sx+10, y:sy, 'font-size':9.5, fill:'#5D6577'}, g).textContent = fmt(nd.n) + ' objects';
    return;
  }
  if (nd.end){
    mk('circle',{cx:nd.x, cy:nd.y, r:6.5, fill:C[nd.end]}, g);
    return;
  }
  nd.c.forEach(([x,o]) => {
    mk('circle',{cx:x, cy:nd.y, r:6.2, fill:'#fff', stroke:C[o], 'stroke-width':1.7}, g);
    mk('circle',{cx:x, cy:nd.y, r:3.3, fill:C[o]}, g);
  });
  const x0 = nd.c.at(-1)[0] + 12;
  const fName = `500 10.5px ${FONT}`, fSub = `400 9.5px ${FONT}`;
  let subW;
  if (nd.n.length === 1) subW = tw(fmt(nd.n[0]) + ' times', fSub);
  else subW = nd.n.reduce((s,v) => s + 9 + tw(fmt(v), fSub) + 5, 0) + tw('times', fSub);
  const w = Math.max(tw(nd.name, fName), subW) + 16, h = 30;
  mk('rect',{x:x0, y:nd.y-h/2, width:w, height:h, rx:3, fill:'#fff', stroke:'#CDD2DA','stroke-width':.8, filter:'url(#sh)'}, g);
  mk('text',{x:x0+8, y:nd.y-2.5, 'font-size':10.5, 'font-weight':500, fill:'#1F2633'}, g).textContent = nd.name;
  if (nd.n.length === 1){
    mk('text',{x:x0+8, y:nd.y+10, 'font-size':9.5, fill:'#5D6577'}, g).textContent = fmt(nd.n[0]) + ' times';
  } else {
    let cx = x0+8;
    nd.n.forEach((v,i) => {
      mk('rect',{x:cx, y:nd.y+3.5, width:6, height:6, rx:1, fill:C[nd.c[i][1]]}, g);
      cx += 9;
      const t = mk('text',{x:cx, y:nd.y+10, 'font-size':9.5, fill:'#5D6577'}, g); t.textContent = fmt(v);
      cx += tw(fmt(v), fSub) + 5;
    });
    mk('text',{x:cx, y:nd.y+10, 'font-size':9.5, fill:'#5D6577'}, g).textContent = 'times';
  }
});

/* zoom + pan */
let z = 0.6;
const canvas = document.getElementById('canvas'), zval = document.getElementById('zval');
function applyZoom(nz, keepCenter=true){
  const cx = (canvas.scrollLeft + canvas.clientWidth/2)/z, cy = (canvas.scrollTop + canvas.clientHeight/2)/z;
  z = Math.min(2, Math.max(0.3, nz));
  const padX = Math.max(0, (canvas.clientWidth - W*z)/2);
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.style.width = W*z + 'px'; svg.style.height = H*z + 'px';
  svg.style.marginLeft = padX + 'px';
  zval.firstChild.textContent = Math.round(z*100) + '% ';
  if (keepCenter){ canvas.scrollLeft = cx*z - canvas.clientWidth/2; canvas.scrollTop = cy*z - canvas.clientHeight/2; }
}
document.getElementById('zin').onclick = () => applyZoom(z + 0.1);
document.getElementById('zout').onclick = () => applyZoom(z - 0.1);
document.getElementById('fit').onclick = () => { applyZoom(Math.min(canvas.clientWidth/W, canvas.clientHeight/H), false); canvas.scrollTop = 0; };
document.getElementById('legendBtn').onclick = () => { const l = document.getElementById('legend'); l.style.display = l.style.display==='block' ? 'none' : 'block'; };
canvas.addEventListener('wheel', e => { if (e.ctrlKey || e.metaKey){ e.preventDefault(); applyZoom(z - e.deltaY*0.002); } }, {passive:false});
let drag = null;
canvas.addEventListener('mousedown', e => { drag = {x:e.clientX, y:e.clientY, l:canvas.scrollLeft, t:canvas.scrollTop}; canvas.classList.add('drag'); });
window.addEventListener('mousemove', e => { if (!drag) return; canvas.scrollLeft = drag.l - (e.clientX-drag.x); canvas.scrollTop = drag.t - (e.clientY-drag.y); });
window.addEventListener('mouseup', () => { drag = null; canvas.classList.remove('drag'); });
window.addEventListener('resize', () => applyZoom(z, false));
applyZoom(Math.min(1, canvas.clientWidth/W, Math.max(0.6, canvas.clientHeight/H)), false);
</script>
